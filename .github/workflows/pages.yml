name: Deploy CEL explorer

on:
  push:
    branches: [main]
    paths:
      - "core_schemas/**"
      - "taxonomies/**"
      - "response_machines/**"
      - "crosswalks/**"
      - "feeds/**"
      - "tooling/**"
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install "jsonschema>=4.0" "pyyaml>=6.0"

      - name: Validate CEL source
        run: |
          python tooling/validate_cel.py
          python -m unittest tooling.test_cel_v0 -v
          python website/build_snapshot.py --check
          node --check website/app.js

      - name: Stage explorer-only artifact
        run: |
          set -euo pipefail
          mkdir -p public
          cp website/index.html website/styles.css website/app.js website/data.js public/
          test -f public/index.html
          test -f public/data.js
          test ! -e public/build_snapshot.py
          test ! -e public/README.md

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
