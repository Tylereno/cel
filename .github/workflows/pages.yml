name: Deploy CEL format surface

on:
  push:
    branches: [main]
    paths:
      - "core_schemas/**"
      - "taxonomies/**"
      - "response_machines/**"
      - "crosswalks/**"
      - "feeds/**"
      - "docs/normative/**"
      - "tooling/**"
      - "website/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install "jsonschema>=4.0" "pyyaml>=6.0"

      - name: Validate CEL source
        run: |
          python tooling/validate_cel.py
          python -m unittest tooling.test_cel_v0 -v
          python website/build_snapshot.py --check
          node --check website/app.js

      - name: Verify published identifier mapping
        run: python tooling/verify_pages_ids.py

      - name: Stage public artifact
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public

          # The explorer is the human front door.
          cp website/index.html website/styles.css website/app.js website/data.js public/

          # The format itself: a file per published identifier, plus the corpus
          # the identifiers describe. Pages serves no directory listing, so an
          # identifier with no artifact behind it is a 404, not a redirect.
          mkdir -p public/schemas public/normative
          cp core_schemas/*.json public/schemas/
          cp -R taxonomies response_machines crosswalks feeds public/
          cp docs/normative/*.md public/normative/
          cp LICENSE NOTICE public/
          python tooling/gen_schema_index.py --out public/schemas/index.html

          # Required surface present, and no source-only file shipped.
          test -f public/index.html
          test -f public/schemas/manifest.json
          test -f public/NOTICE
          test ! -e public/tooling
          test ! -e public/website
          test ! -e public/build_snapshot.py
          test ! -e public/core_schemas

      - name: Verify staged artifact
        run: python tooling/verify_pages_ids.py --public public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
