    parent: disaster.meteorological
    description: Cold wave / extreme cold.
    profiles:
      undrr_hip: MH0502
      cap_event: Extreme Cold Warning
    children: []

  - code: disaster.meteorological.winter_storm
    label: Winter storm
    spoken: disaster meteorological winter storm
    kind: leaf
    parent: disaster.meteorological
    description: Snow storm, blizzard, or ice storm.
    profiles:
