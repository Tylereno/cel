    children: []

  - code: disaster.meteorological.high_wind
    label: High wind
    spoken: disaster meteorological high wind
    kind: leaf
    parent: disaster.meteorological
    description: Damaging non-cyclone wind.
    profiles:
      undrr_hip: MH0301
      cap_event: High Wind Warning
    children: []

  - code: disaster.hydrological
