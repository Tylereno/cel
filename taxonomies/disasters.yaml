id: cel.taxonomy.disasters
version: "0.2.0"
cel_spec: "0.1.0"
title: CEL Disaster Incident Language
description: >
  Speakable incident words Sentinel may ingest. This tree is the CEL
  language, not a copy of 281 UNDRR HIP rows. Current Sentinel adapters
  are a subset of these words, not the ceiling. HIP / GLIDE / CAP
  identifiers belong in profiles so machines can interoperate without
  forcing crews to speak GH0101.
namespace: disaster
root: disaster
codes:
  - code: disaster
    label: Disaster
    spoken: disaster
    kind: root
    description: Root of the CEL incident language.
    children:
      - disaster.fire
      - disaster.geophysical
      - disaster.meteorological
      - disaster.hydrological
      - disaster.environmental
      - disaster.technological
      - disaster.extraterrestrial
      - disaster.biological

  - code: disaster.fire
    label: Fire
    spoken: disaster fire
    kind: category
    parent: disaster
    description: Unwanted combustion incidents.
    children:
      - disaster.fire.wildland
      - disaster.fire.structure
      - disaster.fire.industrial

  - code: disaster.fire.wildland
    label: Wildland fire
    spoken: disaster fire wildland
    kind: leaf
    parent: disaster.fire
    description: Vegetation fire (wildfire) affecting or approaching a site.
    profiles:
      undrr_hip: EN0205
      glide: WF
      cap_category: Fire
    children: []

  - code: disaster.fire.structure
    label: Structure fire
    spoken: disaster fire structure
    kind: leaf
    parent: disaster.fire
    description: Fire involving a building or enclosed structure.
    profiles:
      cap_category: Fire
    children: []

  - code: disaster.fire.industrial
    label: Industrial fire
    spoken: disaster fire industrial
    kind: leaf
    parent: disaster.fire
    description: Fire at an industrial, energy, or fuel facility.
    profiles:
      cap_category: Fire
    children: []

  - code: disaster.geophysical
    label: Geophysical
    spoken: disaster geophysical
    kind: category
    parent: disaster
    description: Earth-process incidents.
    children:
      - disaster.geophysical.earthquake
      - disaster.geophysical.tsunami
      - disaster.geophysical.volcano
      - disaster.geophysical.landslide

  - code: disaster.geophysical.earthquake
    label: Earthquake
    spoken: disaster geophysical earthquake
    kind: leaf
    parent: disaster.geophysical
    description: Seismic event.
    profiles:
      undrr_hip: GH0101
      glide: EQ
      cap_event: Earthquake
    children: []

  - code: disaster.geophysical.tsunami
    label: Tsunami
    spoken: disaster geophysical tsunami
    kind: leaf
    parent: disaster.geophysical
    description: Tsunami-related incident. A USGS earthquake tsunami=1 flag is a related hint, not a tsunami catalog.
    profiles:
      undrr_hip: MH0705
      glide: TS
      cap_event: Tsunami
    children: []

  - code: disaster.geophysical.volcano
    label: Volcano
    spoken: disaster geophysical volcano
    kind: leaf
    parent: disaster.geophysical
    description: Volcanic unrest or eruption. GDACS VO maps here.
    profiles:
      undrr_hip: GH0201
      glide: VO
      cap_event: Volcano
    children: []

  - code: disaster.geophysical.landslide
    label: Landslide
    spoken: disaster geophysical landslide
    kind: leaf
    parent: disaster.geophysical
    description: Gravitational mass movement, debris flow, or slope failure.
    profiles:
      undrr_hip: GH0300
    children: []

  - code: disaster.meteorological
    label: Meteorological
    spoken: disaster meteorological
    kind: category
    parent: disaster
    description: Weather incidents, including NWS CAP event classes.
    children:
      - disaster.meteorological.severe_storm
      - disaster.meteorological.tropical_cyclone
      - disaster.meteorological.tornado
      - disaster.meteorological.extreme_heat
      - disaster.meteorological.extreme_cold
      - disaster.meteorological.winter_storm
      - disaster.meteorological.high_wind

  - code: disaster.meteorological.severe_storm
    label: Severe storm
    spoken: disaster meteorological severe storm
    kind: leaf
    parent: disaster.meteorological
    description: Severe thunderstorm / convective storm.
    profiles:
      undrr_hip: MH0103
      cap_event: Severe Thunderstorm Warning
    children: []

  - code: disaster.meteorological.tropical_cyclone
    label: Tropical cyclone
    spoken: disaster meteorological tropical cyclone
    kind: leaf
    parent: disaster.meteorological
    description: Tropical cyclone / hurricane / typhoon.
    profiles:
      undrr_hip: MH0309
      glide: TC
      cap_event: Hurricane Warning
    children: []

  - code: disaster.meteorological.tornado
    label: Tornado
    spoken: disaster meteorological tornado
    kind: leaf
    parent: disaster.meteorological
    description: Tornado.
    profiles:
      undrr_hip: MH0305
      cap_event: Tornado Warning
    children: []

  - code: disaster.meteorological.extreme_heat
    label: Extreme heat
    spoken: disaster meteorological extreme heat
    kind: leaf
    parent: disaster.meteorological
    description: Heatwave / excessive heat.
    profiles:
      undrr_hip: MH0501
      cap_event: Excessive Heat Warning
    children: []

  - code: disaster.meteorological.extreme_cold
