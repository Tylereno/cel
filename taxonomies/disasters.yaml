      undrr_hip: MH0801
    children: []

  - code: disaster.environmental
    label: Environmental
    spoken: disaster environmental
    kind: category
    parent: disaster
    description: Environmental-quality incidents that affect sites and crews.
    children:
      - disaster.environmental.smoke
      - disaster.environmental.air_quality

  - code: disaster.environmental.smoke
    label: Smoke
    spoken: disaster environmental smoke
    kind: leaf
